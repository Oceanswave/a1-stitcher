name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Fork changes must first be reviewed and moved to a maintainer branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ['3.12', '3.13']
    runs-on: [self-hosted, Linux, X64, rockybot, a1-stitcher]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create isolated Python environment
        env:
          A1_PYTHON: ${{ matrix.python }}
        shell: bash
        run: |
          set -euo pipefail
          command -v uv
          command -v ffmpeg
          command -v ffprobe
          A1_ENV=$(mktemp -d "$RUNNER_TEMP/a1-python.XXXXXX")
          uv venv --managed-python --python "$A1_PYTHON" --seed "$A1_ENV"
          echo "$A1_ENV/bin" >> "$GITHUB_PATH"
          echo "A1_CI_VENV=$A1_ENV" >> "$GITHUB_ENV"
      - name: Install package and development tools
        run: python -m pip install '.[dev]'
      - run: a1-stitch doctor
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=a1_stitcher --cov-report=term-missing --cov-fail-under=80
      - name: Build distribution
        if: matrix.python == '3.12'
        run: python -m build
      - name: Check installed wheel outside checkout
        if: matrix.python == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          A1_WHEEL_ENV=$(mktemp -d "$RUNNER_TEMP/a1-wheel.XXXXXX")
          trap 'rm -rf -- "$A1_WHEEL_ENV"' EXIT
          python -m venv "$A1_WHEEL_ENV"
          "$A1_WHEEL_ENV/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$A1_WHEEL_ENV/bin/a1-stitch" doctor
          "$A1_WHEEL_ENV/bin/python" -m a1_stitcher --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python == '3.12'
        with:
          name: distribution
          path: dist/
          if-no-files-found: error
      - name: Remove job Python environment
        if: always() && env.A1_CI_VENV != ''
        shell: bash
        run: rm -rf -- "$A1_CI_VENV"
